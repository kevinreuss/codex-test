th:100%;accent-color:#536f48;margin:16px 0 0}aside{padding:20px}h2{font-size:19px;margin:6px 0 14px;letter-spacing:-.6px}.file{font-weight:650;overflow-wrap:anywhere}.sub{color:#68746a;font-size:13px;margin:4px 0}.block{border-top:1px solid #d9ddd5;margin-top:19px;padding-top:18px}.op{padding:10px 0;border-bottom:1px solid #e1e5dc}.op strong{font-size:13px}.op select{width:100%;margin-top:6px;font-size:13px;padding:6px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}.speed{width:62px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.error{color:#963c25}.upload:focus-within{outline:2px solid}.upload input{position:absolute;width:1px;height:1px;opacity:0}@media(max-width:850px){.layout{grid-template-columns:1fr}.heading{gap:12px}.time{font-size:11px}.controls{flex-wrap:wrap}aside{margin-bottom:20px}}
[hidden]{display:none!important}.draw-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 17px;background:#eef1ea}.draw-tools label{font-size:13px}.draw-tools input{width:110px;vertical-align:middle}.draw-paper{padding:16px;background:#d9ded6}.draw-paper canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair;background-color:#fcfbf4;background-image:linear-gradient(#64765c18 1px,transparent 1px),linear-gradient(90deg,#64765c18 1px,transparent 1px);background-size:4.04% 7.17%}.line-item{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.line-item select{font-size:13px}.tabs{display:flex;flex-wrap:wrap;gap:4px}

<header><span class="logo">⌁</span><strong>Laserwerk</strong><span class="model">GLOWFORGE BASIC</span></header><main><div class="heading"><h1>Laser-Simulator</h1><label class="upload">↑ SVG laden<input type="file" id="upload" accept=".svg,image/svg+xml"></label></div><div class="layout"><section><div class="viewer"><div class="bar"><b>Arbeitsraum</b><div class="tabs"><button id="drawTab">Zeichnen</button><button id="pan" aria-pressed="false">Verschieben</button> <button id="iso" class="active">3D</button> <button id="realView" aria-pressed="false">Real View</button> <button id="topView">Draufsicht</button><button id="settingsToggle" aria-controls="settingsPanel" aria-expanded="false">Einstellungen</button><button id="fullscreenToggle" aria-pressed="false">⛶ Vollbild</button></div></div><div id="editor" hidden>
